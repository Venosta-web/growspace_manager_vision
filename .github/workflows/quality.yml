---
name: Quality

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: >-
    quality-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Contract, service, and packaging tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Use Python 3.13
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the service and test tools
        run: python -m pip install --editable '.[test]'
      - name: Ruff check
        run: ruff check src tests scripts growspace_vision
      - name: Ruff format
        run: ruff format --check src tests scripts growspace_vision
      - name: Mypy
        run: mypy src growspace_vision scripts
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  app-images:
    name: Locked ${{ matrix.architecture }} App image
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Use Python 3.13
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Cache verified build inputs
        uses: actions/cache@v5.0.3
        with:
          path: .build-inputs/${{ matrix.architecture }}
          key: >-
            vision-build-inputs-${{ matrix.architecture }}-${{
            hashFiles(format('packaging/locks/{0}.lock', matrix.architecture)) }}
      - name: Build and smoke the network-isolated image
        run: ./scripts/build-app-images.sh ${{ matrix.architecture }}
