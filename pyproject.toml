[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "growspace-manager-vision"
version = "1.0.0"
description = "Stateless local image analysis for Growspace Manager"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "ruff==0.16.5",
]

[project.scripts]
growspace-vision = "growspace_vision.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/growspace_vision"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
